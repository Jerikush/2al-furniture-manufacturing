<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>2AL Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #18202b;
    }

    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #071426;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 25px 70px rgba(0,0,0,.25);
    }

    .login-box h1 {
      color: #0b1f3a;
      margin-bottom: 8px;
    }

    .login-box p {
      color: #697386;
      margin-bottom: 25px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #d8dce2;
      border-radius: 8px;
      font-size: 14px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #d4af37;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 13px 20px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-gold {
      width: 100%;
      background: #d4af37;
      color: #071426;
    }

    .error {
      color: #c0392b;
      margin-top: 12px;
      font-size: 14px;
    }

    .dashboard {
      display: none;
      min-height: 100vh;
    }

    header {
      background: #071426;
      color: white;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 20px;
    }

    .logout {
      background: transparent;
      color: white;
      border: 1px solid rgba(255,255,255,.3);
    }

    main {
      padding: 30px;
      max-width: 1400px;
      margin: auto;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }

    .stat {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(7,20,38,.08);
      border: 1px solid rgba(212,175,55,.18);
    }

    .stat span {
      display: block;
      color: #697386;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: .06em;
    }

    .stat strong {
      font-size: 28px;
      color: #0b1f3a;
    }

    .table-card {
      background: white;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(7,20,38,.08);
      overflow-x: auto;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 15px;
    }

    .table-header h2 {
      color: #0b1f3a;
    }

    .refresh {
      background: #0b1f3a;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      text-align: left;
      padding: 13px;
      border-bottom: 1px solid #edf0f3;
      font-size: 13px;
      vertical-align: top;
    }

    th {
      color: #697386;
      font-size: 11px;
      letter-spacing: .05em;
    }

    .status-select {
      min-width: 140px;
      margin: 0;
      padding: 8px;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #697386;
    }

    @media (max-width: 900px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      main {
        padding: 18px;
      }

      header {
        padding: 16px 18px;
      }
    }

    @media (max-width: 500px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .login-box {
        padding: 25px;
      }
    }
    /* =========================================
   SEARCH & FILTER
   ========================================= */

.table-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

#searchInput,
#statusFilter {
  height: 42px;
  padding: 0 14px;
  border: 1px solid rgba(7, 20, 38, 0.14);
  border-radius: 9px;
  background: #ffffff;
  color: #0b1f3a;
  font-size: 13px;
  outline: none;
}

#searchInput {
  width: 220px;
}

#statusFilter {
  min-width: 150px;
}

#searchInput:focus,
#statusFilter:focus {
  border-color: #d4af37;
  box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.10);
}

@media (max-width: 900px) {
  .table-header {
    flex-direction: column;
    align-items: flex-start;
  }

  .table-actions {
    width: 100%;
    flex-wrap: wrap;
  }

  #searchInput {
    flex: 1;
    min-width: 180px;
  }
}

@media (max-width: 600px) {
  .table-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    width: 100%;
  }

  #searchInput {
    width: 100%;
    grid-column: 1 / -1;
  }

  #statusFilter,
  .table-actions .refresh {
    width: 100%;
  }
}/* =========================================
   INQUIRY DETAILS MODAL
   ========================================= */

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(7, 20, 38, 0.68);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  padding: 24px;
  align-items: center;
  justify-content: center;
}

.modal-overlay.active {
  display: flex;
}

.inquiry-modal {
  width: 100%;
  max-width: 760px;
  max-height: 90vh;
  overflow-y: auto;
  background: #ffffff;
  border-radius: 16px;
  box-shadow: 0 30px 90px rgba(7, 20, 38, 0.28);
  border: 1px solid rgba(212, 175, 55, 0.28);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 26px;
  background: #0b1f3a;
  border-bottom: 2px solid #d4af37;
}

.modal-header h2 {
  margin: 0;
  color: #ffffff;
  font-size: 20px;
  font-weight: 700;
}

.modal-close {
  width: 38px;
  height: 38px;
  border: 1px solid rgba(255, 255, 255, 0.20);
  border-radius: 8px;
  background: transparent;
  color: #ffffff;
  font-size: 25px;
  line-height: 1;
  cursor: pointer;
  transition: all 0.2s ease;
}

.modal-close:hover {
  background: rgba(212, 175, 55, 0.15);
  color: #d4af37;
}

.modal-body {
  padding: 28px;
}

.detail-section {
  margin-bottom: 28px;
}

.detail-section:last-child {
  margin-bottom: 0;
}

.detail-section h3 {
  margin: 0 0 18px;
  color: #0b1f3a;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.detail-section h3::after {
  content: "";
  display: block;
  width: 42px;
  height: 2px;
  margin-top: 9px;
  background: #d4af37;
  border-radius: 10px;
}

.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.detail-item {
  padding: 16px;
  background: #f8f9fb;
  border: 1px solid rgba(7, 20, 38, 0.07);
  border-radius: 10px;
}

.detail-item span {
  display: block;
  margin-bottom: 7px;
  color: #697386;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.detail-item strong {
  display: block;
  color: #0b1f3a;
  font-size: 14px;
  font-weight: 600;
  word-break: break-word;
}

.description-item {
  margin-top: 14px;
}

.description-item p {
  margin: 0;
  color: #374151;
  font-size: 14px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  padding: 18px 26px;
  border-top: 1px solid rgba(7, 20, 38, 0.08);
}

.modal-footer .refresh {
  min-width: 90px;
  height: 42px;
  border-radius: 9px;
  cursor: pointer;
}

@media (max-width: 600px) {

  .modal-overlay {
    padding: 12px;
  }

  .inquiry-modal {
    max-height: 94vh;
    border-radius: 12px;
  }

  .modal-header {
    padding: 18px;
  }

  .modal-body {
    padding: 18px;
  }

  .modal-footer {
    padding: 16px 18px;
  }

  .detail-grid {
    grid-template-columns: 1fr;
  }

}
  </style>
  
</head>

<body>

  <!-- LOGIN -->
  <div class="login-screen" id="loginScreen">

    <div class="login-box">

      <h1>2AL Furniture</h1>

      <p>Team Dashboard</p>

      <form id="loginForm">

        <input
          type="email"
          id="email"
          placeholder="Email"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >

        <button class="btn-gold" type="submit">
          Sign In
        </button>

        <div class="error" id="loginError"></div>

      </form>

    </div>

  </div>


  <!-- DASHBOARD -->
  <div class="dashboard" id="dashboard">

    <header>

      <h1>2AL Admin Dashboard</h1>

      <button class="logout" id="logoutBtn">
        Logout
      </button>

    </header>


    <main>

      <div class="stats">

        <div class="stat">
          <span>TOTAL INQUIRIES</span>
          <strong id="totalCount">0</strong>
        </div>

        <div class="stat">
          <span>NEW</span>
          <strong id="newCount">0</strong>
        </div>

        <div class="stat">
          <span>FOLLOW-UP</span>
          <strong id="followupCount">0</strong>
        </div>

        <div class="stat">
          <span>COMPLETED</span>
          <strong id="completedCount">0</strong>
        </div>

      </div>


      <div class="table-card">

     <div class="table-header">

  <h2>Customer Inquiries</h2>

  <div class="table-actions">

    <input
      type="text"
      id="searchInput"
      placeholder="Search inquiries..."
    >

    <select id="statusFilter">
      <option value="All">All Status</option>
      <option value="New">New</option>
      <option value="Contacted">Contacted</option>
      <option value="Consultation">Consultation</option>
      <option value="Quotation">Quotation</option>
      <option value="Won">Won</option>
      <option value="Production">Production</option>
      <option value="Completed">Completed</option>
      <option value="Lost">Lost</option>
    </select>

    <button class="refresh" id="refreshBtn">
      Refresh
    </button>

  </div>

</div>


        <div id="tableContainer">

          <div class="empty">
            Loading inquiries...
          </div>

        </div>

      </div>

    </main>

  </div>


<script>

  /* =========================================
     SUPABASE CONFIG
     ========================================= */

  const SUPABASE_URL = "https://smshlcnxqtkkawxcfugl.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Fr1S92D4HeFlJM4apbVP4g_eKp4lpXS";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================================
     LOGIN
     ========================================= */

  const loginScreen =
    document.getElementById("loginScreen");

  const dashboard =
    document.getElementById("dashboard");

  const loginForm =
    document.getElementById("loginForm");

  const loginError =
    document.getElementById("loginError");


  loginForm.addEventListener("submit", async function(e) {

    e.preventDefault();

    loginError.textContent = "";

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;


    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });


    if (error) {

      loginError.textContent =
        "Invalid email or password.";

      return;

    }


    showDashboard();

  });


  /* =========================================
     CHECK SESSION
     ========================================= */

  async function checkSession() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();


    if (session) {

      showDashboard();

    } else {

      showLogin();

    }

  }


  function showLogin() {

    loginScreen.style.display = "flex";

    dashboard.style.display = "none";

  }


  function showDashboard() {

    loginScreen.style.display = "none";

    dashboard.style.display = "block";

    loadInquiries();

  }


  /* =========================================
     LOAD INQUIRIES
     ========================================= */

  async function loadInquiries() {

    const {
      data,
      error
    } = await supabaseClient
      .from("inquiries")
      .select("*")
      .order("created_at", {
        ascending: false
      });
window.inquiriesData = data || [];

    if (error) {

      document.getElementById("tableContainer").innerHTML =
        `<div class="empty">
          Unable to load inquiries.
        </div>`;

      console.error(error);

      return;

    }


    updateStats(data);

    renderTable(data);

  }


  /* =========================================
     STATS
     ========================================= */

  function updateStats(data) {

    document.getElementById("totalCount").textContent =
      data.length;


    document.getElementById("newCount").textContent =
      data.filter(item =>
        item.status === "New"
      ).length;


    document.getElementById("followupCount").textContent =
      data.filter(item =>
        ["Contacted", "Consultation", "Quotation"]
          .includes(item.status)
      ).length;


    document.getElementById("completedCount").textContent =
      data.filter(item =>
        item.status === "Completed"
      ).length;

  }


  /* =========================================
     TABLE
     ========================================= */

function renderTable(data) {

  const container = document.getElementById("tableContainer");
  const searchInput = document.getElementById("searchInput");
  const statusFilter = document.getElementById("statusFilter");

  const searchTerm = (searchInput?.value || "").toLowerCase().trim();
  const selectedStatus = statusFilter?.value || "All";

  const filteredData = data.filter(item => {

    const searchableText = `
      ${item.full_name || ""}
      ${item.contact_number || ""}
      ${item.email || ""}
      ${item.project_type || ""}
      ${item.project_description || ""}
      ${item.status || ""}
    `.toLowerCase();

    const matchesSearch =
      !searchTerm ||
      searchableText.includes(searchTerm);

    const matchesStatus =
      selectedStatus === "All" ||
      item.status === selectedStatus;

    return matchesSearch && matchesStatus;

  });

  if (!filteredData.length) {

    container.innerHTML =
      `<div class="empty">
        No matching inquiries found.
      </div>`;

    return;
  }

  let html = `
    <table>
      <thead>
        <tr>
          <th>DATE</th>
          <th>CLIENT</th>
          <th>CONTACT</th>
          <th>EMAIL</th>
          <th>PROJECT</th>
          <th>DESCRIPTION</th>
        <th>STATUS</th>
<th>ACTION</th>
        </tr>
      </thead>

      <tbody>
  `;

  filteredData.forEach(item => {

    html += `
      <tr>

        <td>
          ${formatDate(item.created_at)}
        </td>

        <td>
          <strong>
            ${escapeHtml(item.full_name || "")}
          </strong>
        </td>

        <td>
          ${escapeHtml(item.contact_number || "")}
        </td>

        <td>
          ${escapeHtml(item.email || "")}
        </td>

        <td>
          ${escapeHtml(item.project_type || "")}
        </td>

        <td>
          ${escapeHtml(item.project_description || "")}
        </td>

        <td>

          <select
            class="status-select"
            onchange="updateStatus('${item.id}', this.value)"
          >

            ${statusOptions(item.status)}

          </select>

        </td>
<td>
  <button
    class="details-btn"
    onclick="viewInquiry('${item.id}')"
  >
    View
  </button>
</td>
      </tr>
    `;

  });

  html += `
      </tbody>
    </table>
  `;

  container.innerHTML = html;

}
function viewInquiry(id) {

  const inquiry = window.inquiriesData?.find(item => item.id === id);

  if (!inquiry) {
    alert("Inquiry not found.");
    return;
  }

  document.getElementById("detailName").textContent =
    inquiry.full_name || "—";

  document.getElementById("detailContact").textContent =
    inquiry.contact_number || "—";

  document.getElementById("detailEmail").textContent =
    inquiry.email || "—";

  document.getElementById("detailPreferredContact").textContent =
    inquiry.preferred_contact || "—";

  document.getElementById("detailProject").textContent =
    inquiry.project_type || "—";

  document.getElementById("detailStatus").textContent =
    inquiry.status || "—";

  document.getElementById("detailDescription").textContent =
    inquiry.project_description || "—";

  document.getElementById("inquiryModal").classList.add("active");
}
  
function closeInquiryModal() {
  document.getElementById("inquiryModal").classList.remove("active");
}
  document.getElementById("inquiryModal").addEventListener("click", function(event) {

  if (event.target === this) {
    closeInquiryModal();
  }

});
  document.addEventListener("keydown", function(event) {

  if (event.key === "Escape") {
    closeInquiryModal();
  }

});
  /* =========================================
     STATUS
     ========================================= */

  function statusOptions(current) {

    const statuses = [
      "New",
      "Contacted",
      "Consultation",
      "Quotation",
      "Won",
      "Production",
      "Completed",
      "Lost"
    ];


    return statuses.map(status => `

      <option
        value="${status}"
        ${status === current ? "selected" : ""}
      >
        ${status}
      </option>

    `).join("");

  }


  async function updateStatus(id, status) {

    const {
      error
    } = await supabaseClient
      .from("inquiries")
      .update({ status })
      .eq("id", id);


    if (error) {

      alert("Unable to update status.");

      console.error(error);

      return;

    }


    loadInquiries();

  }


  /* =========================================
     LOGOUT
     ========================================= */

  document
    .getElementById("logoutBtn")
    .addEventListener("click", async function() {

      await supabaseClient.auth.signOut();

      showLogin();

    });


  /* =========================================
     REFRESH
     ========================================= */

  document
    .getElementById("refreshBtn")
    .addEventListener("click", loadInquiries);
  
  document
  .getElementById("searchInput")
  .addEventListener("input", loadInquiries);


document
  .getElementById("statusFilter")
  .addEventListener("change", loadInquiries);


  /* =========================================
     HELPERS
     ========================================= */

  function formatDate(date) {

    return new Date(date).toLocaleDateString(
      "en-PH",
      {
        year: "numeric",
        month: "short",
        day: "numeric"
      }
    );

  }


  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  checkSession();

</script>
<div id="inquiryModal" class="modal-overlay">

  <div class="inquiry-modal">

    <div class="modal-header">
      <h2>Inquiry Details</h2>

      <button
        type="button"
        class="modal-close"
        onclick="closeInquiryModal()"
      >
        ×
      </button>
    </div>

    <div class="modal-body">

      <div class="detail-section">
        <h3>Client Information</h3>

        <div class="detail-grid">

          <div class="detail-item">
            <span>CLIENT</span>
            <strong id="detailName">—</strong>
          </div>

          <div class="detail-item">
            <span>CONTACT</span>
            <strong id="detailContact">—</strong>
          </div>

          <div class="detail-item">
            <span>EMAIL</span>
            <strong id="detailEmail">—</strong>
          </div>

          <div class="detail-item">
            <span>PREFERRED CONTACT</span>
            <strong id="detailPreferredContact">—</strong>
          </div>

        </div>
      </div>


      <div class="detail-section">
        <h3>Project Information</h3>

        <div class="detail-grid">

          <div class="detail-item">
            <span>PROJECT TYPE</span>
            <strong id="detailProject">—</strong>
          </div>

          <div class="detail-item">
            <span>STATUS</span>
            <strong id="detailStatus">—</strong>
          </div>

        </div>

        <div class="detail-item description-item">
          <span>DESCRIPTION</span>
          <p id="detailDescription">—</p>
        </div>

      </div>

    </div>

    <div class="modal-footer">

      <button
        type="button"
        class="refresh"
        onclick="closeInquiryModal()"
      >
        Close
      </button>

    </div>

  </div>

</div>
</body>
</html>
